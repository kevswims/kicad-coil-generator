# Peel motor — see /home/kevin/pcbs/coil-generator/motor-parameters.md for
# the source values and status (FIRM vs PLACEHOLDER vs TBD) of each field.
name = "peel"

# FIRM
poles = 8
coils = 9
mean_radius_mm = 7.0

# PLACEHOLDER derivation — motor-parameters.md gives mean radius (7mm) and
# motor OD (~20mm, so outer radius 10mm) but not active radial length
# directly. Assuming the winding is symmetric around the mean radius:
# active_radial_length = 2 * (outer_radius - mean_radius) = 2 * (10 - 7) = 6.
active_radial_length_mm = 6.0

# PLACEHOLDER — trace width/spacing not yet set; motor-parameters.md's own
# suggested starting defaults. Coil pitch here (~4.9mm) is tight, closer to
# fab-minimum trace/space than to an electromagnetics constraint.
trace_width_mm = 0.15
trace_spacing_mm = 0.1
# copper_weight_oz not specified for this motor yet — omitted (informational
# only; not consumed by the layout geometry regardless).

# PLACEHOLDER — the phase bus (inter-coil/termination wiring) carries the
# same current as a coil's own turns but has real room to spare outside
# the coil ring, so there's no reason to eat the coil turns' resistance
# there. 2x trace_width_mm as a starting point; revisit once current
# draw is known well enough to size it properly.
bus_trace_width_mm = 0.3

# FIRM layer count — 6, matching the feed motor. Both motors share the
# board's one physical stackup (feed and peel don't need disjoint layer
# sets, since they occupy separate (x, y) regions and share no nets), so
# peel uses the same 6 layers feed does, not a subset.
layers = ["F.Cu", "In1.Cu", "In2.Cu", "In3.Cu", "In4.Cu", "B.Cu"]

# PLACEHOLDER — no stated winding-direction convention yet; arbitrary start.
layer0_direction = "ccw"

[placement]
# PLACEHOLDER — no physical board layout has been drawn yet. Placed 100mm
# from the feed motor's (0, 0) center, per the ">=3x outer radius" isolation
# guideline motor-parameters.md gives as a rule of thumb (not yet checked
# against an actual board footprint).
center_x_mm = 100.0
center_y_mm = 0.0
rotation_deg = 0.0

[via]
# TBD — not sized against the target fab yet (motor-parameters.md). Reusing
# the exact values proven live against KiCad in Milestone 1's smoke test;
# worth revisiting once real fab minimums are known, since this motor's
# geometry is tighter than the feed motor's.
drill_mm = 0.3
diameter_mm = 0.6

# TBD — no physical board layout yet, so these are placeholder points just
# past the coil's outer radius (mean_radius + active_radial_length/2 = 10mm
# + 3mm margin = 13mm), for each phase's *last* coil's exit lead. Angle
# matters here, not just radius: each one sits 1/3 of the way through the
# open gap between that phase's last coil's exit and its first coil's
# entry (computed from the real winding_map chain, not the phase's nominal
# 0/120/240 axis) — placing it inside either coil's own angular span makes
# its bus arc cross back through that coil's entry/exit, which looks like
# (and electrically is) a short across the coil.
[phase_terminations.a]
x_mm = 3.29
y_mm = -12.58
[phase_terminations.b]
x_mm = 10.60
y_mm = -7.52
[phase_terminations.c]
x_mm = 12.96
y_mm = 1.06

# TBD — same idea, for each phase's *first* coil's entry lead (every phase
# needs both ends brought out). Sits 2/3 of the way through the same gap
# (closer to the first coil's entry than `phase_terminations` is), so the
# two termination points' own bus arcs don't cross each other either.
[phase_start_terminations.a]
x_mm = 9.25
y_mm = -9.14
[phase_start_terminations.b]
x_mm = 12.96
y_mm = -1.06
[phase_start_terminations.c]
x_mm = 10.60
y_mm = 7.52
