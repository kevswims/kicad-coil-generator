# Feed motor — see /home/kevin/pcbs/coil-generator/motor-parameters.md for
# the source values and status (FIRM vs PLACEHOLDER vs TBD) of each field.
name = "feed"

# FIRM
poles = 20
coils = 18
mean_radius_mm = 25.0
active_radial_length_mm = 10.0

# PLACEHOLDER — turns-per-coil vs. current-density tradeoff not finalized;
# expect these to change before production layout (motor-parameters.md).
trace_width_mm = 0.3
trace_spacing_mm = 0.15
copper_weight_oz = 2.0

# PLACEHOLDER — the phase bus (inter-coil/termination wiring) carries the
# same current as a coil's own turns but has real room to spare outside
# the coil ring, so there's no reason to eat the coil turns' resistance
# there. 2x trace_width_mm as a starting point; revisit once current
# draw is known well enough to size it properly.
bus_trace_width_mm = 0.6

# PLACEHOLDER layer count (6) and layer names. The board currently only has
# F.Cu/B.Cu defined — 4 inner copper layers need to be added to the board's
# physical stackup (KiCad Board Setup, or `update_board_stackup` over the
# IPC API) before these layer names resolve to anything real.
layers = ["F.Cu", "In1.Cu", "In2.Cu", "In3.Cu", "In4.Cu", "B.Cu"]

# PLACEHOLDER — no stated winding-direction convention yet; arbitrary start.
layer0_direction = "ccw"

[placement]
# PLACEHOLDER — no physical board layout has been drawn yet. Using (0, 0) as
# one anchor and placing peel 100mm away on the +x axis, per the ">=3x outer
# radius" isolation guideline (~90-100mm for the feed motor's outer radius).
center_x_mm = 0.0
center_y_mm = 0.0
rotation_deg = 0.0

[via]
# TBD — not sized against the target fab yet (motor-parameters.md). Reusing
# the exact values proven live against KiCad in Milestone 1's smoke test.
drill_mm = 0.3
diameter_mm = 0.6

# TBD — no physical board layout yet, so these are placeholder points just
# past the coil's outer radius (mean_radius + active_radial_length/2 = 30mm
# + 5mm margin = 35mm), purely so the generator has somewhere concrete to
# route each phase's *last* coil's exit lead to. Angle matters here, not
# just radius: each one sits 1/3 of the way through the open gap between
# that phase's last coil's exit and its first coil's entry (computed from
# the real winding_map chain, not the phase's nominal 0/120/240 axis) —
# placing it inside either coil's own angular span makes its bus arc cross
# back through that coil's entry/exit, which looks like (and electrically
# is) a short across the coil.
[phase_terminations.a]
x_mm = 27.72
y_mm = -21.37
[phase_terminations.b]
x_mm = 33.36
y_mm = -10.60
[phase_terminations.c]
x_mm = 34.97
y_mm = 1.44

# TBD — same idea, for each phase's *first* coil's entry lead (every phase
# needs both ends brought out). Sits 2/3 of the way through the same gap
# (closer to the first coil's entry than `phase_terminations` is), so the
# two termination points' own bus arcs don't cross each other either.
[phase_start_terminations.a]
x_mm = 32.37
y_mm = -13.32
[phase_start_terminations.b]
x_mm = 34.97
y_mm = -1.44
[phase_start_terminations.c]
x_mm = 33.36
y_mm = 10.60
